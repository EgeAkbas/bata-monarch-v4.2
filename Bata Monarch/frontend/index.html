<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bata Monarch</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>

  <aside class="sidebar">
    <div class="brand">
      Bata <span class="monarch">Monarch</span>
      <small>kişisel asistan</small>
    </div>

    <nav>
      <ul class="menu">
        <li><a href="#" class="active">Sohbet</a></li>
        <li><a href="#">Veri havuzu</a></li>
        <li><a href="#">Hatırlatıcılar</a></li>
        <li><a href="#">Sistem durumu</a></li>
      </ul>
    </nav>

    <div class="history-section">
      <h2>Son konuşmalar</h2>
      <ul class="history">
        <li tabindex="0">-Bilgi Yok-</li>
        <li tabindex="0">-Bilgi Yok-</li>
        <li tabindex="0">-Bilgi Yok-</li>
      </ul>
    </div>

    <div class="status">
      <span class="dot"></span> Sunucu çalışıyor
    </div>
  </aside>

  <main class="chat">
    <header class="chat-header">
      <h1>Sohbet</h1>
      <p>Bata Monarch dosyalarını okuyabilir, hatırlatıcı kurabilir ve komut çalıştırabilir.</p>
    </header>

    <section class="messages" id="messages" aria-live="polite"></section>

    <div class="composer">
      <input type="text" id="input" placeholder="Bata Monarch'a bir şey yaz..." aria-label="Mesaj">
      <button class="btn mic" id="mic" aria-label="Sesle konuş">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </button>
      <button class="btn send" id="send">Gönder</button>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
